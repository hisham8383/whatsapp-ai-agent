<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Staff inbox – log in</title>
<style>
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; background:#f6f7f9; color:#1d2330;
         display:flex; min-height:100vh; align-items:center; justify-content:center; }
  form { background:#fff; border:1px solid #e4e7ec; border-radius:12px; padding:24px; width:min(340px, 92vw); }
  h1 { font-size:18px; margin:0 0 16px; }
  input { width:100%; padding:10px; border:1px solid #e4e7ec; border-radius:8px; font:inherit; margin-bottom:12px; box-sizing:border-box; }
  button { width:100%; background:#128c7e; color:#fff; border:0; border-radius:8px; padding:10px; font:inherit; cursor:pointer; }
  .error { color:#b42318; margin-bottom:12px; }
</style>
</head>
<body>
<form method="post" action="/inbox/login">
  <h1>Staff inbox</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <input type="password" name="password" placeholder="Team password" autocomplete="current-password" required autofocus>
  <button type="submit">Log in</button>
</form>
</body>
</html>
