<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{% if unread %}({{ unread }}) {% endif %}{% block title %}Staff inbox{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e4e7ec;
          --accent:#128c7e; --warn:#b54708; --warnbg:#fffaeb; --staff:#e8f3ff; --bot:#f2f4f7; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:10px 16px; display:flex; gap:12px; align-items:center; }
  header a { color:#fff; text-decoration:none; font-weight:600; }
  header form { margin-left:auto; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  h2 { font-size:15px; margin:24px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; }
  a.card { display:block; color:inherit; text-decoration:none; }
  a.card:hover { border-color:var(--accent); }
  .row { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:13px; }
  .badge { background:#d92d20; color:#fff; border-radius:999px; padding:0 8px; font-size:12px; font-weight:600; }
  .tag { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:0 6px; font-size:12px; }
  .banner { background:var(--warnbg); color:var(--warn); border:1px solid #fedf89; border-radius:8px; padding:10px 12px; margin:8px 0; }
  .msg { max-width:80%; padding:8px 12px; border-radius:10px; margin:6px 0; white-space:pre-wrap; word-wrap:break-word; }
  .msg.customer { background:var(--card); border:1px solid var(--line); }
  .msg.bot { background:var(--bot); margin-left:auto; }
  .msg.staff { background:var(--staff); margin-left:auto; }
  .msg .meta { display:block; color:var(--muted); font-size:12px; margin-top:4px; }
  textarea { width:100%; min-height:90px; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; font:inherit; cursor:pointer; }
  button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--muted); font-weight:600; }
</style>
</head>
<body>
<header>
  <a href="/inbox">Staff inbox</a>
  <form method="post" action="/inbox/logout"><button class="secondary" type="submit">Log out</button></form>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
