apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-agent-api
  labels: {app: whatsapp-agent, role: api}
# Serves the Meta webhook and the staff inbox (/inbox). Stateless: 2+ replicas are fine.
spec:
  replicas: 2
  selector:
    matchLabels: {app: whatsapp-agent, role: api}
  template:
    metadata:
      labels: {app: whatsapp-agent, role: api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: whatsapp-ai-agent:latest   # replace with the client's registry path
          args: ["api"]
          envFrom:
            - configMapRef: {name: whatsapp-agent-config}
            - secretRef: {name: whatsapp-agent-secrets}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 384Mi}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 20}
