BOOKING_PROVIDER: "google_calendar"                 # or internal
CALENDAR_ID: "xxxx@group.calendar.google.com"
BOOKING_API_BASE_URL: ""
HANDOFF_HOURS_MESSAGE: "فريقنا يرد من الأحد إلى الخميس، 9 صباحًا إلى 9 مساءً. || Our team replies Sunday to Thursday, 9am to 9pm."
HANDOFF_AUTO_RELEASE_HOURS: "24"
LOG_RETENTION_DAYS: "90"
WORKER_WAKE_URL: ""                                # low-cost mode only: the worker's Cloud Run URL
LLM_PROVIDER: "anthropic"
LLM_MODEL: "claude-haiku-4-5-20251001"
LLM_MAX_HISTORY_MESSAGES: "20"
LLM_MAX_OUTPUT_TOKENS: "400"
