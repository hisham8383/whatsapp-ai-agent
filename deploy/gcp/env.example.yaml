# Non-secret settings for Cloud Run (CLAUDE.md §8). Copy to env.yaml (git-ignored),
# fill in, and pass with --env-vars-file. Secrets never go here: see README step 3.
WHATSAPP_PHONE_NUMBER_ID: "000000000000000"
WHATSAPP_BUSINESS_ACCOUNT_ID: "000000000000000"
META_GRAPH_API_VERSION: "v23.0"
BUSINESS_TIMEZONE: "Asia/Riyadh"
DEFAULT_LANGUAGE: "ar"
TONE: "friendly"
ASSISTANT_NAME: "Sara"
BUSINESS_CONFIG_PATH: "./knowledge/business.yaml"   # demo: ./examples/demo-clinic/business.yaml
FAQ_PATH: "./knowledge/faqs.yaml"                   # demo: ./examples/demo-clinic/faqs.yaml
