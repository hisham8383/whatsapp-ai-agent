# DEMO FAQs for the fictional clinic in business.yaml. Not client content.
faqs:
  - q_ar: "هل الكشف مجاني مع التنظيف؟"
    a_ar: "نعم، الكشف مجاني إذا سويت التنظيف في نفس الزيارة."
    q_en: "Is the check-up free with a cleaning?"
    a_en: "Yes, the check-up is free if you have a cleaning in the same visit."
  - q_ar: "هل أحتاج موعد مسبق؟"
    a_ar: "نعم، الزيارات بموعد مسبق فقط، ونقدر نحجز لك هنا في واتساب."
    q_en: "Do I need an appointment?"
    a_en: "Yes, visits are by appointment only, and we can book you here on WhatsApp."
  - q_ar: "هل تقبلون التأمين؟"
    a_ar: "نعم، نقبل تأمين بوبا والتعاونية."
    q_en: "Do you accept insurance?"
    a_en: "Yes, we accept Bupa and Tawuniya insurance."
  - q_ar: "وش طرق الدفع المتاحة؟"
    a_ar: "نقبل الدفع نقدًا، ومدى، وفيزا، وآبل باي."
    q_en: "Which payment methods do you accept?"
    a_en: "We accept cash, mada, Visa and Apple Pay."
  - q_ar: "هل فيه مواقف سيارات؟"
    a_ar: "نعم، فيه مواقف مجانية أمام العيادة."
    q_en: "Is there parking?"
    a_en: "Yes, there is free parking in front of the clinic."
  - q_ar: "هل عندكم طبيبة أسنان أطفال؟"
    a_ar: "نعم، د. نورة متخصصة في أسنان الأطفال."
    q_en: "Do you have a children's dentist?"
    a_en: "Yes, Dr. Noura specializes in children's dentistry."
  - q_ar: "كم تدوم نتيجة التبييض؟"
    a_ar: "تدوم نتيجة التبييض عادة من سنة إلى سنتين حسب العناية."
    q_en: "How long does whitening last?"
    a_en: "Whitening results usually last one to two years, depending on care."
  - q_ar: "هل التقسيط متاح؟"
    a_ar: "نعم، التقسيط متاح عبر تابي للمبالغ فوق 500 ريال."
    q_en: "Do you offer installments?"
    a_en: "Yes, installments are available with Tabby for amounts over 500 SAR."
  - q_ar: "كم عمر الطفل المناسب لأول زيارة؟"
    a_ar: "ننصح بأول زيارة عند ظهور أول سن أو قبل عمر السنة."
    q_en: "When should a child have their first dental visit?"
    a_en: "We recommend the first visit when the first tooth appears, or before age one."
  - q_ar: "هل يوجد طبيبة نساء؟"
    a_ar: "نعم، جميع أطبائنا طبيبات."
    q_en: "Do you have female dentists?"
    a_en: "Yes, all our dentists are women."
